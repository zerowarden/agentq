[project]
name = "agent-skills"
version = "0.1.0"
description = "Agent skills toolkit: Python scripts and tests for repository exploration, review, and verification."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

# Static checks start with the typed boundary surface introduced by W01.
# Add legacy modules as they are cleaned; explicitly passed paths are still
# linted so ad-hoc checks on legacy files remain possible.
[tool.ruff]
target-version = "py310"
line-length = 88
include = [
    "skills/agent-toolkit/scripts/agentq_lib/contracts/*.py",
    "skills/agent-toolkit/scripts/agentq_lib/evidence.py",
    "skills/agent-toolkit/scripts/agentq_lib/emission.py",
    "skills/agent-toolkit/tests/test_contracts.py",
    "skills/agent-toolkit/tests/test_coverage_contract.py",
    "skills/agent-toolkit/tests/test_mutation_safety.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.black]
target-version = ["py310"]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["skills/agent-toolkit/tests"]

[tool.pyright]
include = [
    "skills/agent-toolkit/scripts/agentq_lib/contracts",
    "skills/agent-toolkit/scripts/agentq_lib/evidence.py",
    "skills/agent-toolkit/scripts/agentq_lib/emission.py",
]
pythonVersion = "3.10"
typeCheckingMode = "basic"
# contracts/__init__.py exports lazily through __getattr__; pyright cannot see
# those names in __all__.
reportUnsupportedDunderAll = false

