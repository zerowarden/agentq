[project]
name = "agent-skills"
version = "0.1.0"
description = "Agent skills toolkit: Python scripts and tests for repository exploration, review, and verification."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

# Static checks cover the agent-toolkit scripts and tests trees. The typed
# boundary surface introduced by W01 remains the pyright scope.
[tool.ruff]
target-version = "py310"
line-length = 88
include = [
    "skills/agent-toolkit/scripts/**/*.py",
    "skills/agent-toolkit/tests/**/*.py",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "C901",
    "PLR0911",
    "PLR0912",
    "SIM102",
    "SIM103",
    "SIM114",
    "SIM116",
    "RET505",
    "RUF100",
]

# Legacy complexity backlog: each entry is a file whose functions still exceed
# the complexity defaults. Remove a file once its functions are decomposed; do
# not add new files. Everything else in these files is still enforced.
[tool.ruff.lint.per-file-ignores]
"skills/agent-toolkit/scripts/agentq_lib/audit.py" = ["C901", "PLR0912"]
"skills/agent-toolkit/scripts/agentq_lib/budgeting.py" = ["C901", "PLR0912"]
"skills/agent-toolkit/scripts/agentq_lib/codemod.py" = ["C901"]
"skills/agent-toolkit/scripts/agentq_lib/gitops.py" = ["C901", "PLR0911"]
"skills/agent-toolkit/scripts/agentq_lib/impact.py" = ["C901", "PLR0912"]
"skills/agent-toolkit/scripts/agentq_lib/inspectops.py" = ["C901", "PLR0911"]
"skills/agent-toolkit/scripts/agentq_lib/pythonnav.py" = ["C901", "PLR0912"]
"skills/agent-toolkit/scripts/agentq_lib/runops.py" = ["C901", "PLR0912"]
"skills/agent-toolkit/scripts/agentq_lib/search.py" = ["C901", "PLR0912"]
"skills/agent-toolkit/scripts/agentq_lib/telemetry.py" = ["C901", "PLR0911", "PLR0912"]
"skills/agent-toolkit/scripts/agentq_lib/testplan.py" = ["C901", "PLR0912"]
"skills/agent-toolkit/scripts/agentq_lib/tsnav.py" = ["C901", "PLR0912"]
"skills/agent-toolkit/scripts/agentq_lib/verification.py" = ["C901", "PLR0912"]
"skills/agent-toolkit/scripts/agentq_lib/verifychanged.py" = ["C901", "PLR0912"]
"skills/agent-toolkit/scripts/validate_skills.py" = ["C901", "PLR0912"]

[tool.black]
target-version = ["py310"]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["skills/agent-toolkit/tests"]

[tool.pyright]
include = [
    "skills/agent-toolkit/scripts/agentq_lib/cli",
    "skills/agent-toolkit/scripts/agentq_lib/contracts",
    "skills/agent-toolkit/scripts/agentq_lib/continuations.py",
    "skills/agent-toolkit/scripts/agentq_lib/evidence.py",
    "skills/agent-toolkit/scripts/agentq_lib/emission.py",
    "skills/agent-toolkit/scripts/agentq_lib/process.py",
]
pythonVersion = "3.10"
typeCheckingMode = "basic"
# contracts/__init__.py exports lazily through __getattr__; pyright cannot see
# those names in __all__.
reportUnsupportedDunderAll = false

