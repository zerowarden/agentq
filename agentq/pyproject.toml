[project]
name = "agentq"
version = "0.1.0"
description = "Privacy-preserving, token-bounded repository tools for coding agents."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentq = "agentq.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentq.navigation.providers" = ["ts_nav.mjs"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

# Static checks cover the production package and the project test suite.
# The typed boundary surface introduced by W01 remains the pyright scope.
[tool.ruff]
target-version = "py310"
line-length = 88
include = [
    "src/**/*.py",
    "tests/**/*.py",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "C901",
    "PLR0911",
    "PLR0912",
    "SIM102",
    "SIM103",
    "SIM114",
    "SIM116",
    "RET505",
    "RUF100",
]

[tool.black]
target-version = ["py310"]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src/agentq"]
strict = [
    "src/agentq/core",
    "src/agentq/requests.py",
    "src/agentq/persistence",
]
pythonVersion = "3.10"
typeCheckingMode = "strict"
# Runtime contract validation is deliberate: dataclass annotations alone never
# validate wire/argv/persisted input (see agentq.core.validation).
reportUnnecessaryIsInstance = "none"
reportMissingTypeArgument = "error"
reportMissingParameterType = "error"
reportUnknownParameterType = "error"
